name: Deploy (Deno Deploy)

on:
  push:
    branches: [development]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: onboard-ubq-fi
      PREVIEW_PROJECT: onboard-ubq-fi-preview
      PROD_BRANCH: ${{ github.event.repository.default_branch }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      FRONTEND_URL: https://onboard.ubq.fi
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x

      - name: Install Bun
        run: |
          set -euo pipefail
          BUN_VERSION="1.2.x" curl -fsSL https://bun.sh/install | bash
          echo "${HOME}/.bun/bin" >> "$GITHUB_PATH"

      - name: Install deployctl
        run: |
          set -euo pipefail
          deno install -gArf jsr:@deno/deployctl@1.12.0
          echo "${HOME}/.deno/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          target="$PREVIEW_PROJECT"
          prod_flag=""
          if [ "${GITHUB_REF_NAME}" = "$PROD_BRANCH" ]; then
            target="$PROJECT"
            prod_flag="--prod"
          fi

          mapfile -t ignored_paths < <(git ls-files -o --ignored --exclude-standard --directory --no-empty-directory)
          excludes=()
          for path in "${ignored_paths[@]}"; do
            case "$path" in
              static/dist|static/dist/*) continue ;;
            esac
            excludes+=("--exclude=${path}")
          done

          deployctl deploy \
            --project="$target" \
            $prod_flag \
            --entrypoint=serve.ts \
            --root="." \
            --token="$DENO_DEPLOY_TOKEN" \
            --include="." \
            --include="static/dist/**" \
            --include="deno.json" \
            "${excludes[@]}" \
            --env-var="SUPABASE_URL=${SUPABASE_URL}" \
            --env-var="SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" \
            --env-var="FRONTEND_URL=${FRONTEND_URL}"
