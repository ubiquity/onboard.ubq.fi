name: Deploy (Deno Deploy)

on:
  push:
    branches: [development]
  workflow_dispatch:

jobs:
  deploy:
    uses: ubiquity/deno-deploy-workflow/.github/workflows/deno-deploy-reusable.yml@main
    secrets: inherit
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      FRONTEND_URL: https://onboard.ubq.fi
      STATIC_DIR: static/dist
    with:
      project: onboard-ubq-fi
      preview_project: onboard-ubq-fi-preview
      entrypoint: serve.ts
      install_command: |
        bun install
      build_command: |
        bun run build
      env_var_keys: |
        SUPABASE_URL
        SUPABASE_ANON_KEY
        FRONTEND_URL
        STATIC_DIR
      bun_version: "1.1.x"
      deno_version: v2.x
      deployctl_version: "1.12.0"
      prod_branch: development
      include: |
        static/**
        build/**
      exclude: |
        node_modules
        tests
        cypress
